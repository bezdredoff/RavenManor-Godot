<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Room Builder browser smoke</title></head>
<body><pre id="result">STARTED</pre><iframe id="app" src="../index.html" style="width:980px;height:800px"></iframe>
<script>
(async()=>{
 const output=document.getElementById('result');
 function assert(cond,msg){if(!cond)throw new Error(msg);}
 function waitUntil(check,timeout=14000){return new Promise((resolve,reject)=>{const start=Date.now();function checkAgain(){try{if(check())return resolve();if(Date.now()-start>timeout)return reject(new Error('Timeout waiting for '+check.toString()));setTimeout(checkAgain,100);}catch(e){reject(e);}}checkAgain();});}
 try{
  const frame=document.getElementById('app');
  await waitUntil(()=>frame.contentDocument?.URL.endsWith('/index.html')&&frame.contentDocument?.readyState==='complete');
  const w=frame.contentWindow,d=frame.contentDocument;
  w.confirm=()=>true;
  await waitUntil(()=>d.querySelector('#catalogInfo')?.textContent?.includes('120'));
  await waitUntil(()=>!!d.querySelector('#newRoom')?.onclick);
  assert(d.querySelector('#previewMode')?.value==='game','default view must be game');
  d.querySelector('#exportMenu').click();
  d.querySelector('#newRoom').click();
  await waitUntil(()=>d.querySelector('#objectCount')?.textContent?.includes('8 объектов'));
  assert(d.querySelector('#roomWidth').value==='700','Room width must match Godot');
  assert(d.querySelector('#roomHeight').value==='690','Room height must match Godot');
  await waitUntil(()=>d.querySelectorAll('.asset-preview img[src*="reference/sprites/"]').length>=7);
  assert(d.querySelector('#populateHall').disabled,'do not overwrite furnished Hall');
  assert(!d.querySelector('#moveActor')&&!d.querySelector('#showActor'),'legacy bespoke actor tool removed');
  assert(d.querySelector('#togglePalette')&&d.querySelector('#toggleInspector'),'independent sidebar controls');
  const workspace=d.querySelector('.workspace');
  d.querySelector('#togglePalette').click();
  assert(workspace.classList.contains('palette-collapsed'),'left panel collapses');
  assert(!workspace.classList.contains('inspector-collapsed'),'right remains visible');
  d.querySelector('#toggleInspector').click();
  assert(workspace.classList.contains('palette-collapsed')&&workspace.classList.contains('inspector-collapsed'),'panels collapse independently');
  d.querySelector('#togglePalette').click();
  assert(!workspace.classList.contains('palette-collapsed')&&workspace.classList.contains('inspector-collapsed'),'left can reopen alone');
  d.querySelector('#toggleInspector').click();
  assert(!workspace.classList.contains('inspector-collapsed'),'right reopens independently');
  d.querySelector('#search').value='Оноэ';
  d.querySelector('#search').dispatchEvent(new w.Event('input',{bubbles:true}));
  const card=[...d.querySelectorAll('.asset-card')].find(b=>b.textContent.includes('Оноэ'));
  assert(card,'Onoe should be visible in asset library without custom tool');
  card.click();
  assert(d.querySelector('[data-tool="stamp"]').classList.contains('active'),'character selection arms normal stamp');
  const canvas=d.querySelector('#canvas');
  canvas.setPointerCapture=()=>{};
  const pointer=(type,x,y)=>{const r=canvas.getBoundingClientRect();canvas.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:5,pointerType:'mouse',button:0,clientX:r.left+x,clientY:r.top+y}));};
  const cx=canvas.clientWidth/2,cy=canvas.clientHeight/2;
  d.querySelector('[data-tool="wall"]').click();
  pointer('pointerdown',cx-100,cy-90);pointer('pointermove',cx+100,cy-90);pointer('pointerup',cx+100,cy-90);
  await waitUntil(()=>d.querySelector('#objectCount')?.textContent?.includes('1 стен'));
  d.querySelector('[data-tool="opening"]').click();
  pointer('pointerdown',cx,cy-90);pointer('pointerup',cx,cy-90);
  await waitUntil(()=>d.querySelector('#objectCount')?.textContent?.includes('1 проём'));
  d.querySelector('[data-tool="stamp"]').click();
  pointer('pointerdown',cx,cy);pointer('pointerup',cx,cy);
  await waitUntil(()=>d.querySelector('#objectCount')?.textContent?.includes('9 объектов'));
  d.querySelector('[data-tool="select"]').click();
  pointer('pointerdown',cx,cy-27);
  assert(d.querySelector('#properties').textContent.includes('Оноэ'),'Onoe selected like furniture');
  const initialX=Number(d.querySelector('#properties input[type="number"]')?.value);
  pointer('pointermove',cx+34,cy-13);pointer('pointerup',cx+34,cy-13);
  await waitUntil(()=>Number(d.querySelector('#properties input[type="number"]')?.value)!==initialX);
  assert(d.querySelector('#exportDialog').open===false,'new-room dialog should be closed');
  output.textContent='PASS: wall draw/opening socket, 8 Hall objects, 7 PNG cards, dual panels, character stamp/select/drag';
  document.documentElement.dataset.testResult='pass';
 }catch(err){output.textContent='FAIL: '+(err.stack||err.message);document.documentElement.dataset.testResult='fail';}
})();
</script></body></html>
