name: Temporary branch cleanup (owner requested)

on:
  push:
    branches: [incoming]
    paths:
      - '.github/workflows/temp-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable initiating incoming commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify backup, unchanged branch heads and no open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          inventory=docs/branch_cleanup/branch_heads_before_2026-11-01.json
          test -s "$inventory"
          jq -e 'length == 99 and any(.[]; .name == "main") and any(.[]; .name == "incoming")' "$inventory" > /dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" | jq -s 'add | map({name, sha: .commit.sha, protected}) | sort_by(.name)' > "$RUNNER_TEMP/current-branches.json"
          jq -e --slurpfile saved "$inventory" '$saved[0] as $old | all(.[] | select(.name != "main" and .name != "incoming"); . as $b | any($old[]; .name == $b.name and .sha == $b.sha))' "$RUNNER_TEMP/current-branches.json" > /dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq length)" -eq 0
          echo "Verified recovery inventory, no unarchived/changed branch, no open PR"
      - name: Preserve additional independent recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: raven-branch-refs-cleanup-2026-11-01
          path: docs/branch_cleanup/branch_heads_before_2026-11-01.json
          retention-days: 90
      - name: Delete only archived and unchanged non-main non-incoming refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          inventory=docs/branch_cleanup/branch_heads_before_2026-11-01.json
          mapfile -t branches < <(jq -r '.[] | select(.name != "main" and .name != "incoming") | .name' "$RUNNER_TEMP/current-branches.json")
          echo "Deleting ${#branches[@]} obsolete branches (main/incoming protected by explicit exclusions)"
          for branch in "${branches[@]}"; do
            [[ "$branch" != main && "$branch" != incoming ]] || { echo 'Refuse to delete protected keep branch' >&2; exit 1; }
            saved_sha="$(jq -r --arg b "$branch" '.[] | select(.name == $b) | .sha' "$inventory")"
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha')"
            [[ -n "$saved_sha" && "$saved_sha" == "$current_sha" ]] || { echo "Branch moved: ${branch}; stopping" >&2; exit 1; }
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "Deleted: ${branch} ${saved_sha}"
          done
      - name: Verify exactly main and incoming remain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" | jq -s 'add | map(.name) | sort' > "$RUNNER_TEMP/remaining-branches.json"
          jq -e '. == ["incoming", "main"]' "$RUNNER_TEMP/remaining-branches.json" > /dev/null
          echo 'SUCCESS: only main and incoming remain'
