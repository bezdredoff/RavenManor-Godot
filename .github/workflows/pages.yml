name: Test and deploy Prototype Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Independent PRs no longer serialize behind main Pages builds.
  group: raven-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  # Independent module checks, with one aggregate required build gate.
  data:
    name: data-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce per-PR evidence or legacy status pair
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 scripts/raven/tools/check_pr_governance.py --base-sha "$BASE_SHA" --head-ref "$HEAD_REF"
      - name: Check shell syntax and source/data contracts
        run: bash -n scripts/check.sh scripts/check_data.sh && bash scripts/check_data.sh

  runtime:
    name: godot-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Godot runtime without Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
      - name: Verify original Hall layout and regenerate the actual Godot scene
        run: |
          python3 scripts/raven/tools/build_original_hall_layout.py --check
          python3 scripts/raven/tools/import_room_builder_game.py examples/room_builder_hall_original.json
          test -f scenes/raven/generated/RM_ROOM_HALL_GamePreview.tscn
          # Prove the committed scene is byte-for-byte generated from current
          # original world-map geometry + pilot visual contract.
          git diff --exit-code -- scenes/raven/generated/RM_ROOM_HALL_GamePreview.tscn
      - name: Run Raven checks
        run: RAVEN_SKIP_DATA_CHECKS=1 bash scripts/check.sh
      - name: Real Godot import test of generated 65-degree room
        run: |
          godot --headless --path . --script res://tests/raven/room_builder_game_import_smoke.gd --quit-after 80

  room-builder:
    name: room-builder
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate Room Builder PWA and Godot draft importer
        run: |
          python3 -m pip install --quiet pillow
          node --check tools/room-builder/app.mjs
          node --check tools/room-builder/model.mjs
          node --check tools/room-builder/wall-tools.mjs
          node --check tools/room-builder/catalog.mjs
          node --check tools/room-builder/projection.mjs
          node --check tools/room-builder/room-shell.mjs
          node --check tools/room-builder/visual-contract.mjs
          node --check tools/room-builder/hall-pilot.mjs
          node --check tools/room-builder/sw.js
          node --test tools/room-builder/tests/*.test.mjs
          node --test tests/raven/incoming_zip_cleanup.test.mjs
          python3 -m unittest scripts/raven/tools/test_room_builder_import.py scripts/raven/tools/test_hall_visual_sync.py scripts/raven/tools/test_room_builder_game_import.py scripts/raven/tools/test_wall_kit.py scripts/raven/tools/test_comfyui_wall_workflow.py scripts/raven/tools/test_wall_tileset.py scripts/raven/tools/test_blender_kit.py
          python3 scripts/raven/comfyui/build_wall_asset_manifest.py
          git diff --exit-code -- data/raven/comfyui_wall_asset_manifest.json
          python3 scripts/raven/tools/build_room_catalog.py --check
      - name: Browser smoke — independent panels and normal character editing
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'Headless Chrome/Chromium is required for UI smoke'; exit 1; }
          ( cd tools/room-builder && python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/room-builder-server.log 2>&1 ) &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          # Browser startup can occasionally stall in shared CI runners. Retry once
          # with a fresh profile; the functional PASS assertion remains mandatory.
          passed=0
          for attempt in 1 2; do
            if timeout 75 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --user-data-dir="/tmp/room-builder-smoke-$GITHUB_RUN_ID-$attempt" --virtual-time-budget=20000 --dump-dom http://127.0.0.1:4173/tests/browser_smoke.html > /tmp/room-builder-smoke.html 2>/tmp/room-builder-chrome.log; then
              if grep -q 'PASS: wall draw/opening socket, volumetric room view, textured wall preview, side-wall portal proof, 8 Hall objects, 7 PNG cards, dual panels, character stamp/select/drag' /tmp/room-builder-smoke.html; then
                passed=1
                break
              fi
            fi
            echo "Room Builder browser smoke attempt $attempt failed or timed out"
            tail -n 25 /tmp/room-builder-chrome.log || true
          done
          test "$passed" -eq 1 || { cat /tmp/room-builder-smoke.html; cat /tmp/room-builder-chrome.log; exit 1; }
          grep -q 'PASS: wall draw/opening socket, volumetric room view, textured wall preview, side-wall portal proof, 8 Hall objects, 7 PNG cards, dual panels, character stamp/select/drag' /tmp/room-builder-smoke.html || { cat /tmp/room-builder-smoke.html; cat /tmp/room-builder-chrome.log; exit 1; }
      - name: Verify published Room Builder mirrors its canonical sources
        run: |
          for file in index.html app.mjs model.mjs wall-tools.mjs room-shell.mjs catalog.mjs projection.mjs visual-contract.mjs hall-pilot.mjs sw.js style.css manifest.webmanifest catalog/room-items.json reference/season1_world_map.json reference/season1_wall_kit.json reference/hall_twin_staircases.png reference/hall_visual_contract.json reference/wall_tileset/grand_module.png reference/sprites/armchair_clean.png reference/sprites/burgundy_runner.png reference/sprites/grandfather_clock.png reference/sprites/round_side_table.png reference/sprites/entry_console.png reference/sprites/ancestor_gallery_composite.png reference/sprites/onoe_walk_sheet_v1.png icons/icon.svg icons/icon-192.png icons/icon-512.png; do
            cmp "tools/room-builder/$file" "builder/$file"
          done
          for file in $(cd tools/room-builder/reference/wall_kit && find . -type f \( -name '*.png' -o -name '*.json' \)); do
            cmp "tools/room-builder/reference/wall_kit/$file" "builder/reference/wall_kit/$file"
          done
          cmp data/raven/season1_world_map.json tools/room-builder/reference/season1_world_map.json
          cmp data/raven/season1_wall_kit.json tools/room-builder/reference/season1_wall_kit.json
          cmp data/raven/hall_visual_contract.json tools/room-builder/reference/hall_visual_contract.json
          cmp assets/raven/hall/generated_pilot/backgrounds/hall_twin_staircases.png tools/room-builder/reference/hall_twin_staircases.png

  art:
    name: art-pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate art production handbook (without deployment bundle)
        shell: bash
        run: |
          set -euo pipefail
          # Separate runners no longer inherit Pillow from the Room Builder job.
          python3 -m pip install --quiet numpy pillow
          python3 scripts/raven/tools/build_art_handbook.py --check
          python3 -m unittest scripts/raven/tools/test_art_handbook.py
          node --check art-handbook/app.js
          node --check art-handbook/data.js
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/art-handbook-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          timeout 50 "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --user-data-dir="/tmp/art-handbook-$GITHUB_RUN_ID" --virtual-time-budget=20000 --dump-dom http://127.0.0.1:4175/art-handbook/tests/browser_smoke.html > /tmp/art-handbook-smoke.html 2>/tmp/art-handbook-chrome.log
          grep -q 'data-result="pass"' /tmp/art-handbook-smoke.html || { cat /tmp/art-handbook-smoke.html; cat /tmp/art-handbook-chrome.log; exit 1; }

  web-package:
    name: web-package
    runs-on: ubuntu-latest
    needs: data
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d template-unpack
          mv template-unpack/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Prepare Web-only 1024px VN portrait imports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.raven.tools.test_prepare_web_portrait_imports
          python3 scripts/raven/tools/prepare_web_portrait_imports.py --project-root .
          # Only .import descriptors change in this throwaway CI checkout.
          git diff --name-only -- assets/raven/characters/ > "$RUNNER_TEMP/web-portrait-import-diff.txt"
          test "$(wc -l < "$RUNNER_TEMP/web-portrait-import-diff.txt")" -eq 62
          if grep -Ev '^assets/raven/characters/[^/]+/[^/]+\.webp\.import$' "$RUNNER_TEMP/web-portrait-import-diff.txt"; then
            echo "::error::Non-import character file modified by Web preparation"
            exit 1
          fi
      - name: Generate untracked Godot VN background import descriptors
        shell: bash
        run: |
          set -euo pipefail
          # Unlike portraits, VN backgrounds do not have tracked .webp.import files.
          godot --headless --editor --path . --import
          test "$(find assets/raven/vn_backgrounds -type f -name '*.webp.import' | wc -l)" -eq 26
      - name: Apply Web-only 1080px VN background import limits
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.raven.tools.test_prepare_web_background_imports
          python3 scripts/raven/tools/prepare_web_background_imports.py --project-root .
          # Only Godot-generated untracked .import files may change, not art/catalog.
          test -z "$(git diff --name-only -- assets/raven/vn_backgrounds/ data/raven/production/vn_background_catalog.json)"
          test "$(find assets/raven/vn_backgrounds -type f -name '*.webp.import' -exec grep -l '^process/size_limit=1080$' {} \; | wc -l)" -eq 26
      - name: Reimport optimized Web backgrounds using Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import
      - name: Export Web build
        run: |
          mkdir -p build/web
          set -euo pipefail
          godot --headless --path . --export-release "GitHub Pages Web" build/web/index.html 2>&1 | tee "$RUNNER_TEMP/raven-web-export.log"
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
      - name: Verify actual imported Web portraits and alpha
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/raven/web_portrait_import_smoke.gd
      - name: Verify Web-imported VN backgrounds, dimensions and aspect ratios
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --script res://tests/raven/web_background_import_smoke.gd
      - name: Build production dashboard from tracked status sources
        run: |
          python3 scripts/raven/tools/build_production_dashboard.py --check
          python3 scripts/raven/tools/build_production_dashboard.py --output build/web/dashboard/status.json
          cp dashboard/index.html dashboard/style.css dashboard/app.mjs build/web/dashboard/
          python3 scripts/raven/tools/embed_dashboard_priority.py --root build/web/dashboard
          node --check dashboard/app.mjs
          python3 scripts/raven/tools/test_dashboard_browser.py --root build/web/dashboard
          test -s build/web/dashboard/index.html
          test -s build/web/dashboard/status.json
      - name: Audit PCK footprint and editor-only resource exclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.raven.tools.test_report_web_pck
          python3 scripts/raven/tools/report_web_pck.py \
            --project-root . --web-root build/web \
            --export-log "$RUNNER_TEMP/raven-web-export.log" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify minimal Pages publishing scope and report sizes
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/dashboard/index.html
          test -s build/web/dashboard/status.json
          # Static authoring tools are checked separately in CI but never
          # duplicated in the public game site's deployment payload.
          test ! -e build/web/art-handbook
          test ! -e build/web/builder
          test ! -e build/web/preview
          echo '=== Pages game+dashboard payload ==='
          du -sh build/web build/web/index.pck build/web/dashboard
          {
            echo '### Production Pages footprint (game + dashboard only)'
            echo '~~~'
            du -sh build/web build/web/index.pck build/web/dashboard
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload non-deployed candidate Web artifact
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/candidate/mobile-')
        uses: actions/upload-artifact@v4
        with:
          name: raven-candidate-web-${{ github.run_id }}
          path: build/web/
          retention-days: 7
          if-no-files-found: error
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [data, runtime, room-builder, art, web-package]
    if: ${{ success() }}
    steps:
      - name: All module and Web jobs passed
        run: echo 'Raven full required CI passed.'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Only one custom Pages deploy at once. This cannot serialize GitHub's
    # separate legacy/branch Pages workflow: set Settings > Pages > Source to
    # GitHub Actions before attempting publication.
    concurrency:
      group: raven-pages-production
      cancel-in-progress: false
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, web-package]
    steps:
      - name: Require GitHub Actions as the only Pages publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! pages_source="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type')"; then
            echo '::error title=Pages configuration unreadable::Unable to read GitHub Pages settings; check the Pages site and token permissions.'
            exit 1
          fi
          if [[ "$pages_source" != "workflow" ]]; then
            echo "::error title=Conflicting Pages publishers::Pages build_type=$pages_source. Change repository Settings > Pages > Build and deployment > Source to GitHub Actions; the legacy branch publisher and this workflow must not compete."
            exit 1
          fi
          echo 'Pages source verified: GitHub Actions; no legacy branch publisher expected.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Prior deploys timed out in deployment_queued/syncing_files at the
          # action's default 10 minutes. Do not indefinitely mask a real outage.
          timeout: 1800000
