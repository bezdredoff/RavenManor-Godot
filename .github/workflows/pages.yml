name: Test and deploy Prototype Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          chmod +x "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d template-unpack
          mv template-unpack/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Run Raven checks
        run: bash scripts/check.sh

      - name: Validate Room Builder PWA and Godot draft importer
        run: |
          node --check tools/room-builder/app.mjs
          node --check tools/room-builder/model.mjs
          node --check tools/room-builder/catalog.mjs
          node --check tools/room-builder/projection.mjs
          node --check tools/room-builder/visual-contract.mjs
          node --check tools/room-builder/sw.js
          node --test tools/room-builder/tests/*.test.mjs
          python3 -m unittest scripts/raven/tools/test_room_builder_import.py
          python3 scripts/raven/tools/build_room_catalog.py --check

      - name: Verify published Room Builder mirrors its canonical sources
        run: |
          for file in index.html app.mjs model.mjs catalog.mjs projection.mjs visual-contract.mjs sw.js style.css manifest.webmanifest catalog/room-items.json reference/season1_world_map.json reference/hall_twin_staircases.png reference/hall_visual_contract.json reference/sprites/armchair_clean.png reference/sprites/burgundy_runner.png reference/sprites/grandfather_clock.png reference/sprites/round_side_table.png reference/sprites/entry_console.png reference/sprites/ancestor_gallery_composite.png reference/sprites/onoe_walk_sheet_v1.png icons/icon.svg icons/icon-192.png icons/icon-512.png; do
            cmp "tools/room-builder/$file" "builder/$file"
          done
          cmp data/raven/season1_world_map.json tools/room-builder/reference/season1_world_map.json
          cmp data/raven/hall_visual_contract.json tools/room-builder/reference/hall_visual_contract.json
          cmp assets/raven/hall/generated_pilot/backgrounds/hall_twin_staircases.png tools/room-builder/reference/hall_twin_staircases.png

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "GitHub Pages Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Bundle standalone Room Builder PWA
        run: |
          mkdir -p build/web/builder/icons build/web/builder/catalog build/web/builder/reference/sprites
          cp tools/room-builder/index.html tools/room-builder/style.css tools/room-builder/app.mjs tools/room-builder/model.mjs tools/room-builder/catalog.mjs tools/room-builder/projection.mjs tools/room-builder/visual-contract.mjs tools/room-builder/sw.js tools/room-builder/manifest.webmanifest build/web/builder/
          cp tools/room-builder/catalog/room-items.json build/web/builder/catalog/
          cp tools/room-builder/reference/season1_world_map.json tools/room-builder/reference/hall_twin_staircases.png tools/room-builder/reference/hall_visual_contract.json build/web/builder/reference/
          cp tools/room-builder/reference/sprites/*.png build/web/builder/reference/sprites/
          cp tools/room-builder/icons/icon.svg tools/room-builder/icons/icon-192.png tools/room-builder/icons/icon-512.png build/web/builder/icons/
          test -f build/web/builder/index.html
          test -f build/web/builder/catalog/room-items.json
          test -f build/web/builder/reference/hall_twin_staircases.png
          test -f build/web/builder/reference/hall_visual_contract.json
          test -f build/web/builder/reference/sprites/onoe_walk_sheet_v1.png
          test -f build/web/builder/icons/icon-512.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
